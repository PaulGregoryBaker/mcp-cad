name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '22'
  VCPKG_ROOT: /opt/vcpkg

jobs:
  # ─── Job 1: PR CI — lint + unit + contract ─────────────────────────────────
  pr-ci:
    name: PR CI (lint + unit + contract)
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Lint TypeScript
        run: cd ts && npm run lint

      - name: Lint TypeScript import boundaries (constitution principle I)
        run: cd ts && npm run lint:boundaries

      - name: Type check
        run: cd ts && npm run typecheck

      - name: Format check
        run: cd ts && npm run format:check

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Lint C++ include boundaries (constitution principle I)
        run: node cpp/tools/check-include-boundaries.mjs

      - name: Lint C++/TS NAPI field sync
        run: node cpp/tools/check-napi-field-sync.mjs

      - name: Build C++ (geometry_engine)
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j$(nproc)

      - name: clang-tidy (constitution principles VIII, X static complement)
        # Config verified 2026-07-21 against one real file (geometry_service_shell.cc,
        # manual include flags, no compile_commands.json — this project's local
        # Windows build uses the Visual Studio generator, which doesn't emit one;
        # Linux CI's Makefiles/Ninja-based build does, via -p build below): 11 real,
        # legitimate findings, zero noise from OCCT's own headers. Still non-blocking
        # — that was one file, not a full-codebase baseline, and the TS-side
        # equivalent found 75+ pre-existing violations once run broadly. Flip to
        # blocking once a full run + baseline decision (same pattern as
        # .dependency-cruiser-known-violations.json) is done.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy
          cd cpp
          find src/geometry -name '*.cc' | xargs clang-tidy -p build

      - name: Run TypeScript unit tests
        run: cd ts && npm run test:unit

      - name: Run TypeScript contract tests
        run: cd ts && npm run test:contract

      - name: Contract fixtures are up to date (spec 010)
        run: |
          cd ts && npm run schemas:export
          git diff --exit-code contract-fixtures/ || (echo "contract-fixtures/ is stale: run 'npm run schemas:export' and commit, then sync the Form·AI·tion client (scripts/sync_contract_fixtures.ps1)" && exit 1)

      - name: Run C++ unit tests
        run: cd cpp/build && ctest --output-on-failure -R "geometry|napi_contract"

  # ─── Job 2: Merge CI — + BC integration + sanitizer ───────────────────────
  merge-ci:
    name: Merge CI (+ BC integration + sanitizer)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
          # Persistence tests (vitest project 'persist') start a throwaway
          # dolt sql-server per test file with its own data dir, port and
          # DOLT_ROOT_PATH (tests/helpers/dolt-harness.ts) and a test storage
          # account (withTestAccount) — no shared server or database here.

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Build C++ with AddressSanitizer
        run: |
          cd cpp
          cmake -B build-asan \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DASAN=ON
          cmake --build build-asan -j$(nproc)

      - name: Run all TypeScript tests
        run: cd ts && npm test

      - name: Run C++ tests under AddressSanitizer
        run: |
          cd cpp/build-asan
          ASAN_OPTIONS=abort_on_error=0:log_path=asan.log ctest --output-on-failure
          if grep -q "ERROR: AddressSanitizer" asan.log 2>/dev/null; then
            echo "AddressSanitizer errors detected" && cat asan.log && exit 1
          fi

      - name: Upload sanitizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-log-merge
          path: cpp/build-asan/asan.log

  # ─── Job 3: Nightly — full sweep ───────────────────────────────────────────
  nightly:
    name: Nightly (full sweep)
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version
          # Persistence tests (vitest project 'persist') start a throwaway
          # dolt sql-server per test file with its own data dir, port and
          # DOLT_ROOT_PATH (tests/helpers/dolt-harness.ts) and a test storage
          # account (withTestAccount) — no shared server or database here.

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Build C++
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run full TypeScript test suite with coverage
        run: cd ts && npm run test:coverage

      - name: Run all C++ tests
        run: cd cpp/build && ctest --output-on-failure

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nightly
          path: ts/coverage/

  # ─── Job 4: Release Gate — matrix + evidence bundle ───────────────────────
  release-gate:
    name: Release Gate (matrix + evidence)
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
        node: ['22']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install vcpkg + C++ deps
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
            $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          else
            brew install vcpkg
          fi
          cd cpp && $VCPKG_ROOT/vcpkg install

      - name: Build C++
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run complete test suite
        run: |
          cd ts && npm run test:coverage
          cd cpp/build && ctest --output-on-failure -T Test

      - name: Collect evidence bundle
        run: |
          mkdir -p docs/test-reports
          cp ts/coverage/junit.xml docs/test-reports/vitest_${{ matrix.os }}.xml || true
          cp cpp/build/test-reports/*.xml docs/test-reports/ || true

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/test-reports/
