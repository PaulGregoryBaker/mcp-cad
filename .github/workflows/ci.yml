name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # Nightly at 02:00 UTC
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '22'
  VCPKG_ROOT: /opt/vcpkg

jobs:
  # ─── Job 1: PR CI — lint + unit + contract ─────────────────────────────────
  pr-ci:
    name: PR CI (lint + unit + contract)
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Lint TypeScript
        run: cd ts && npm run lint

      - name: Lint TypeScript import boundaries (constitution principle I)
        run: cd ts && npm run lint:boundaries

      - name: Type check
        run: cd ts && npm run typecheck

      - name: Format check
        run: cd ts && npm run format:check

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Lint C++ include boundaries (constitution principle I)
        run: node cpp/tools/check-include-boundaries.mjs

      - name: Build C++ (geometry_engine)
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          cmake --build build -j$(nproc)

      - name: clang-tidy (constitution principles VIII, X static complement)
        # Config verified 2026-07-21 against one real file (geometry_service_shell.cc,
        # manual include flags, no compile_commands.json — this project's local
        # Windows build uses the Visual Studio generator, which doesn't emit one;
        # Linux CI's Makefiles/Ninja-based build does, via -p build below): 11 real,
        # legitimate findings, zero noise from OCCT's own headers. Still non-blocking
        # — that was one file, not a full-codebase baseline, and the TS-side
        # equivalent found 75+ pre-existing violations once run broadly. Flip to
        # blocking once a full run + baseline decision (same pattern as
        # .dependency-cruiser-known-violations.json) is done.
        continue-on-error: true
        run: |
          sudo apt-get update && sudo apt-get install -y clang-tidy
          cd cpp
          find src/geometry -name '*.cc' | xargs clang-tidy -p build

      - name: Run TypeScript unit tests
        run: cd ts && npm run test:unit

      - name: Run TypeScript contract tests
        run: cd ts && npm run test:contract

      - name: Run C++ unit tests
        run: cd cpp/build && ctest --output-on-failure -R "geometry|napi_contract"

  # ─── Job 2: Merge CI — + BC integration + sanitizer ───────────────────────
  merge-ci:
    name: Merge CI (+ BC integration + sanitizer)
    runs-on: ubuntu-22.04
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version

      - name: Cache Dolt data directory
        uses: actions/cache@v3
        with:
          path: /tmp/dolt
          key: dolt-data-${{ hashFiles('ts/src/semantic/migrations/**') }}
          restore-keys: dolt-data-

      - name: Start Dolt SQL server
        run: |
          dolt config --global --add user.email "ci@mcp-cad.test"
          dolt config --global --add user.name "MCP-CAD CI"
          mkdir -p /tmp/dolt/semantic_braai
          if [ ! -f /tmp/dolt/semantic_braai/.dolt/config.json ]; then
            cd /tmp/dolt/semantic_braai && dolt init
          fi
          dolt sql-server --host=127.0.0.1 --port=3306 --user=root --password="" \
            --data-dir=/tmp/dolt &
          echo $! > /tmp/dolt/dolt.pid
          for i in $(seq 1 30); do
            if dolt sql --host=127.0.0.1 --port=3306 --user=root \
                --password="" -q "SELECT 1" 2>/dev/null; then
              echo "Dolt ready after ${i}s"; break
            fi
            sleep 1
          done

      - name: Apply Dolt migrations
        run: |
          cd ts && node -e "
            const { createConnection } = require('mysql2/promise');
            const fs = require('fs');
            const path = require('path');
            (async () => {
              const conn = await createConnection({host:'127.0.0.1',port:3306,user:'root',password:'',database:'semantic_braai',multipleStatements:true});
              const dir = path.join(__dirname,'src/semantic/migrations');
              if (!fs.existsSync(dir)) { conn.end(); return; }
              const files = fs.readdirSync(dir).filter(f=>f.endsWith('.sql')).sort();
              for (const f of files) {
                await conn.query(fs.readFileSync(path.join(dir,f),'utf8'));
                console.log('Applied:', f);
              }
              await conn.end();
            })().catch(e=>{console.error(e);process.exit(1)});
          "
        env:
          DOLT_HOST: 127.0.0.1
          DOLT_PORT: 3306

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Build C++ with AddressSanitizer
        run: |
          cd cpp
          cmake -B build-asan \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DASAN=ON
          cmake --build build-asan -j$(nproc)

      - name: Run all TypeScript tests
        run: cd ts && npm test
        env:
          DOLT_HOST: 127.0.0.1
          DOLT_PORT: 3306

      - name: Stop Dolt SQL server
        if: always()
        run: |
          if [ -f /tmp/dolt/dolt.pid ]; then
            kill "$(cat /tmp/dolt/dolt.pid)" 2>/dev/null || true
          fi

      - name: Run C++ tests under AddressSanitizer
        run: |
          cd cpp/build-asan
          ASAN_OPTIONS=abort_on_error=0:log_path=asan.log ctest --output-on-failure
          if grep -q "ERROR: AddressSanitizer" asan.log 2>/dev/null; then
            echo "AddressSanitizer errors detected" && cat asan.log && exit 1
          fi

      - name: Upload sanitizer log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-log-merge
          path: cpp/build-asan/asan.log

  # ─── Job 3: Nightly — full sweep ───────────────────────────────────────────
  nightly:
    name: Nightly (full sweep)
    runs-on: ubuntu-22.04
    if: github.event_name == 'schedule'

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install Dolt
        run: |
          curl -L https://github.com/dolthub/dolt/releases/latest/download/install.sh | sudo bash
          dolt version

      - name: Cache Dolt data directory
        uses: actions/cache@v3
        with:
          path: /tmp/dolt
          key: dolt-data-${{ hashFiles('ts/src/semantic/migrations/**') }}
          restore-keys: dolt-data-

      - name: Start Dolt SQL server
        run: |
          dolt config --global --add user.email "ci@mcp-cad.test"
          dolt config --global --add user.name "MCP-CAD CI"
          mkdir -p /tmp/dolt/semantic_braai
          if [ ! -f /tmp/dolt/semantic_braai/.dolt/config.json ]; then
            cd /tmp/dolt/semantic_braai && dolt init
          fi
          dolt sql-server --host=127.0.0.1 --port=3306 --user=root --password="" \
            --data-dir=/tmp/dolt &
          echo $! > /tmp/dolt/dolt.pid
          for i in $(seq 1 30); do
            if dolt sql --host=127.0.0.1 --port=3306 --user=root \
                --password="" -q "SELECT 1" 2>/dev/null; then
              echo "Dolt ready after ${i}s"; break
            fi
            sleep 1
          done

      - name: Apply Dolt migrations
        run: |
          cd ts && node -e "
            const { createConnection } = require('mysql2/promise');
            const fs = require('fs');
            const path = require('path');
            (async () => {
              const conn = await createConnection({host:'127.0.0.1',port:3306,user:'root',password:'',database:'semantic_braai',multipleStatements:true});
              const dir = path.join(__dirname,'src/semantic/migrations');
              if (!fs.existsSync(dir)) { conn.end(); return; }
              const files = fs.readdirSync(dir).filter(f=>f.endsWith('.sql')).sort();
              for (const f of files) {
                await conn.query(fs.readFileSync(path.join(dir,f),'utf8'));
                console.log('Applied:', f);
              }
              await conn.end();
            })().catch(e=>{console.error(e);process.exit(1)});
          "
        env:
          DOLT_HOST: 127.0.0.1
          DOLT_PORT: 3306

      - name: Install vcpkg + C++ deps
        run: |
          git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
          $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          cd cpp && $VCPKG_ROOT/vcpkg install --triplet x64-linux

      - name: Build C++
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run full TypeScript test suite with coverage
        run: cd ts && npm run test:coverage
        env:
          DOLT_HOST: 127.0.0.1
          DOLT_PORT: 3306

      - name: Stop Dolt SQL server
        if: always()
        run: |
          if [ -f /tmp/dolt/dolt.pid ]; then
            kill "$(cat /tmp/dolt/dolt.pid)" 2>/dev/null || true
          fi

      - name: Run all C++ tests
        run: cd cpp/build && ctest --output-on-failure

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-nightly
          path: ts/coverage/

  # ─── Job 4: Release Gate — matrix + evidence bundle ───────────────────────
  release-gate:
    name: Release Gate (matrix + evidence)
    runs-on: ${{ matrix.os }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        os: [ubuntu-22.04, macos-14]
        node: ['22']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
          cache-dependency-path: ts/package-lock.json

      - name: Install TypeScript dependencies
        run: cd ts && npm ci

      - name: Install vcpkg + C++ deps
        run: |
          if [ "${{ runner.os }}" == "Linux" ]; then
            git clone https://github.com/microsoft/vcpkg.git $VCPKG_ROOT
            $VCPKG_ROOT/bootstrap-vcpkg.sh -disableMetrics
          else
            brew install vcpkg
          fi
          cd cpp && $VCPKG_ROOT/vcpkg install

      - name: Build C++
        run: |
          cd cpp
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Run complete test suite
        run: |
          cd ts && npm run test:coverage
          cd cpp/build && ctest --output-on-failure -T Test

      - name: Collect evidence bundle
        run: |
          mkdir -p docs/test-reports
          cp ts/coverage/junit.xml docs/test-reports/vitest_${{ matrix.os }}.xml || true
          cp cpp/build/test-reports/*.xml docs/test-reports/ || true

      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-node${{ matrix.node }}
          path: docs/test-reports/
