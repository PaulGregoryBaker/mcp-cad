name: Release Evidence Collection

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  collect-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: docs/test-reports/
